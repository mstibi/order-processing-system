name: ci
on: [push, pull_request]
jobs:
  m1-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 90
      - name: Health
        run: curl -fsS localhost:8000/health
      - name: API tests
        run: docker compose exec -T api pytest -q
      - name: fake-payments tests
        run: docker compose run --rm --no-deps fake-payments pytest -q
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      # TODO(M7): set up k6 (grafana/setup-k6-action), seed with scripts/seed.py, run `k6 run load/orders.js`,
      # upload results/load.json as an artifact.
