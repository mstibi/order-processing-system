services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: shop
    ports: ["5432:5432"]
    volumes:
      # schema.sql runs only on first start of an empty volume: `docker compose down -v` to re-apply
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  fake-payments:
    build: ./fake-payments
    environment:
      FAIL_RATE: ${FAIL_RATE:-0}
      TIMEOUT_RATE: ${TIMEOUT_RATE:-0}
      LATENCY_MS: ${LATENCY_MS:-0}
    ports: ["9000:9000"]

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/shop
      PAYMENTS_URL: http://fake-payments:9000
      PAYMENTS_TIMEOUT_S: ${PAYMENTS_TIMEOUT_S:-3}
      PENDING_STALE_S: ${PENDING_STALE_S:-60}
    ports: ["8000:8000"]
    volumes:
      - ./api:/app   # dev: tests/code edits visible without rebuild (`docker compose restart api` to reload code)
    depends_on:
      postgres: { condition: service_healthy }
      fake-payments: { condition: service_started }

  # load generator, only started on demand: docker compose --profile load run --rm k6
  k6:
    image: grafana/k6:2.3.0
    profiles: ["load"]
    environment:
      BASE_URL: http://api:8000
      OUT: /results/load.json
      VUS: ${VUS:-50}
      DURATION: ${DURATION:-30s}
    volumes:
      - ./load:/load:ro
      - ./results:/results
    command: ["run", "/load/orders.js"]
    depends_on:
      api: { condition: service_healthy }
